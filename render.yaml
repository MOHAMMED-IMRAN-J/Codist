databases:
  - name: codist-db
    plan: free
    databaseName: codist_db
    user: codist_user

services:
  - type: redis
    name: codist-redis
    plan: free
    ipAllowList: []

  - type: web
    name: codist-backend
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codist-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: codist-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: codist.settings.production
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://codist.com" # Update this to your frontend URL
